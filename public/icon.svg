<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#accentGlow)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Back Card (Card B - Indigo) -->
  <g filter="url(#shadow)" transform="translate(160, 110) rotate(12)">
    <rect width="240" height="150" rx="20" fill="url(#cardGrad2)"/>
    <!-- Card Chip -->
    <rect x="25" y="45" width="40" height="30" rx="6" fill="#fbbf24" fill-opacity="0.9"/>
    <!-- Card Stripe line -->
    <circle cx="195" cy="50" r="16" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="210" cy="50" r="16" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- Front Card (Card A - Emerald) -->
  <g filter="url(#shadow)" transform="translate(100, 195) rotate(-6)">
    <rect width="250" height="160" rx="20" fill="url(#cardGrad1)"/>
    <!-- Card Chip -->
    <rect x="28" y="50" width="42" height="32" rx="6" fill="#fef08a" fill-opacity="0.95"/>
    <!-- Card Emboss Lines -->
    <rect x="28" y="110" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="28" y="128" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
    <!-- Visa/Mastercard style circles -->
    <circle cx="195" cy="115" r="18" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="212" cy="115" r="18" fill="#ffffff" fill-opacity="0.25"/>
  </g>

  <!-- Dynamic Trend Arrow (Growth / Control) -->
  <g filter="url(#shadow)">
    <circle cx="370" cy="360" r="48" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
    <!-- Arrow icon -->
    <path d="M352 378 L388 342 M388 342 L368 342 M388 342 L388 362" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
